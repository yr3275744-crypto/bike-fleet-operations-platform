services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  producer:
    build: ./services/IngestionService
    container_name: producer
    environment:
      BOOTSTRAP_SERVERS: broker:9092
      STATION_INFORMATION_TOPIC: bike.station-information
      STATION_STATUS_TOPIC: bike.station-status
      VEHICLE_TYPES_TOPIC: bike.vehicle-types
      STATION_INFORMATION_URL: https://gbfs.lyft.com/gbfs/2.3/bkn/en/station_information.json
      STATION_STATUS_URL: https://gbfs.lyft.com/gbfs/2.3/bkn/en/station_status.json
      VEHICLE_TYPES_URL: https://gbfs.lyft.com/gbfs/2.3/bkn/en/vehicle_types.json
  mysql:
    image: mysql:8.0
    container_name: bike-fleet-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
  mongo:
    image: mongo
    container_name: bike-fleet-mongo
    ports:
      - "27017:27017"